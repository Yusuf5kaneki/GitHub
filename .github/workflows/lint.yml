name: codecheck
on: 
  push:
    paths: "*.py"

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout current repo
      uses: actions/checkout@v7
    - name: python set up
      uses: actions/setup-python@v7
      with:
        python-version: '3.13' 
        run: python my_script.py
    - name: install ruff
      run: pip install ruff
      
    - name: check_code_quality
      run: ruff check .
    
